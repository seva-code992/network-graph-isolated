services:
  network-graph:
    build: .
    ports:
      - "8000:8000"
    # A Neo4j running on this machine is reached as host.docker.internal (Docker Desktop runs containers
    # in a VM, so "localhost" / host networking would not point at the machine).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EXPERIMENT_SOURCE: ${EXPERIMENT_SOURCE:-mock}   # "neo4j": real experiments
      NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-guest123}
      SEED_DEMO_LISTS: "1"          # demo lists sampled from the embeddings; set 0 once real lists come from the API
      MAX_EDGES: "100000"           # safety cap: every possible edge is returned, so huge selections are refused
    volumes:
      # <species>-embeddings.npy / <species>-gene-ids.npy
      - ${EMBEDDINGS_HOST_DIR:-${HOME}/Work/plantgenie-api/pg-data/embeddings}:/data/embeddings:ro
      - network_graph_data:/data/app
    networks:
      - plantgenie_network

  # Only for when no Neo4j runs on the host (then set NEO4J_URI=bolt://neo4j:7687):
  # docker compose --profile neo4j up
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:2026.01.4-community-trixie
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/guest123
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - /home/seva/plantgenie-neo4j/data:/data
      - /home/seva/plantgenie-neo4j:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p guest123 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - plantgenie_network

volumes:
  network_graph_data:

networks:
  plantgenie_network:
